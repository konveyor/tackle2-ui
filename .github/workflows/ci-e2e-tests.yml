name: CI (e2e tests)

on:
  push:
    branches:
      - "main"
      - "release-*"

  pull_request:
    branches:
      - "main"
      - "release-*"

  merge_group:

  workflow_call:
    inputs:
      checkout_ref:
        type: string
        description: Git ref to checkout (defaults to the triggering ref)
        required: false

permissions:
  contents: read

concurrency:
  group: ci-e2e-tests-${{ inputs.checkout_ref || github.ref }}
  cancel-in-progress: true

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      should-test: ${{ steps.check-changes.outputs.should-test }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref }}
          fetch-depth: 0

      - name: Did only docs and hacks change?
        id: docs-and-hacks-only
        uses: tj-actions/changed-files@22103cc46bda19c2b464ffe86db46df6922fd323 # v46
        with:
          files: |
            docs/**
            hack/**
            **/*.md
            **/*.mdc
            .coderabbit.yaml

      - name: Check what types of changes have been made
        id: check-changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          ONLY_DOCS_HACKS: ${{ steps.docs-and-hacks-only.outputs.only_modified }}
        run: |
          # should-test: Skip e2e tests for pull_request and merge_group events with exclusively
          # docs/hacks changes. For push and workflow_call, always run tests regardless of what changed.
          SHOULD_TEST=$(
            if [[ $EVENT_NAME == "pull_request" || $EVENT_NAME == "merge_group" ]] && [[ $ONLY_DOCS_HACKS == true ]]; then
              echo "false"
            else
              echo "true"
            fi
          )

          echo "changes_only_docs_hacks=${ONLY_DOCS_HACKS:-false}" >> "$GITHUB_OUTPUT"
          echo "should-test=$SHOULD_TEST" >> "$GITHUB_OUTPUT"

      - name: Summarize findings
        env:
          ONLY_DOCS_HACKS: ${{ steps.docs-and-hacks-only.outputs.only_modified }}
          MODIFIED_DOCS_HACKS: ${{ steps.docs-and-hacks-only.outputs.all_modified_files }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Change Detection Findings
            - Changes are only to docs and hacks? \`${{ steps.check-changes.outputs.changes_only_docs_hacks }}\`
            - Should the e2e test jobs run? \`${{ steps.check-changes.outputs.should-test }}\`
          EOF

          if [[ $ONLY_DOCS_HACKS == true ]] && [[ -n "$MODIFIED_DOCS_HACKS" ]]; then
            echo "## Modified files that do not impact e2e tests" >> "$GITHUB_STEP_SUMMARY"
            for file in ${MODIFIED_DOCS_HACKS}; do
              echo "  - \`$file\`" >> "$GITHUB_STEP_SUMMARY"
            done
          fi

  determine-branch-params:
    needs:
      - check-changes
    if: ${{ needs.check-changes.outputs.should-test == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      target_branch: ${{ steps.params.outputs.target_branch }}
      bundle_image: ${{ steps.params.outputs.bundle_image }}
      install_konveyor_version: ${{ steps.params.outputs.install_konveyor_version }}
      build_checkout_ref: ${{ steps.params.outputs.build_checkout_ref }}
      test_from_checkout_ref: ${{ steps.params.outputs.test_from_checkout_ref }}
    steps:
      - name: Determine branch-specific parameters
        id: params
        env:
          CHECKOUT_REF: ${{ inputs.checkout_ref }}
          BASE_REF: ${{ github.base_ref }}
          MERGE_GROUP_BASE_REF: ${{ github.event.merge_group.base_ref }}
          REF_NAME: ${{ github.ref_name }}
          GITHUB_REF: ${{ github.ref }}
        run: |
          # Strip refs/heads/ prefix from merge_group base_ref if present
          MERGE_GROUP_BASE="${MERGE_GROUP_BASE_REF#refs/heads/}"

          # Resolve the target branch (deployment context)
          # Priority: explicit workflow_call input > merge_group base > PR base branch > push branch
          TARGET="${CHECKOUT_REF:-${MERGE_GROUP_BASE:-${BASE_REF:-${REF_NAME}}}}"
          TARGET="${TARGET#refs/heads/}"

          # Resolve the checkout ref (code to build)
          # workflow_call with explicit ref: use that ref
          # pull_request / push: use github.ref (PR merge ref or branch ref)
          CHECKOUT="${CHECKOUT_REF:-${GITHUB_REF}}"

          # Resolve the test from checkout ref (code to test)
          # TODO: This implies build and test from the same ref. If we need to build and test
          #       from different refs, this var will need to be updated.
          TEST_FROM_CHECKOUT_REF="${CHECKOUT}"

          # Map target branch to operator version and bundle image tag
          # For release branches, use the corresponding release tag instead of the branch
          if [[ "$TARGET" == "main" ]]; then
            IMAGE_TAG="latest"
            OPERATOR_VERSION="main"
          elif [[ "$TARGET" == "release-0.10" ]]; then
            # MTA 8.2 corresponds to operator v0.10.0-beta.1
            IMAGE_TAG="v0.10.0-beta.1"
            OPERATOR_VERSION="v0.10.0-beta.1"
          elif [[ "$TARGET" == "release-0.11" ]]; then
            # MTA 8.3 corresponds to operator v0.11.0-beta.1
            IMAGE_TAG="v0.11.0-beta.1"
            OPERATOR_VERSION="v0.11.0-beta.1"
          else
            # For other release branches, use the branch name
            IMAGE_TAG="$TARGET"
            OPERATOR_VERSION="$TARGET"
          fi

          BUNDLE="quay.io/konveyor/tackle2-operator-bundle:${IMAGE_TAG}"

          echo "target_branch=$TARGET" >> "$GITHUB_OUTPUT"
          echo "bundle_image=$BUNDLE" >> "$GITHUB_OUTPUT"
          echo "install_konveyor_version=$OPERATOR_VERSION" >> "$GITHUB_OUTPUT"
          echo "build_checkout_ref=$CHECKOUT" >> "$GITHUB_OUTPUT"
          echo "test_from_checkout_ref=$TEST_FROM_CHECKOUT_REF" >> "$GITHUB_OUTPUT"

          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Branch Parameters
            - target_branch: \`$TARGET\`
            - build_checkout_ref: \`$CHECKOUT\`
            - test_from_checkout_ref: \`$TEST_FROM_CHECKOUT_REF\`
            - install_konveyor_version: \`$OPERATOR_VERSION\`
            - bundle_image: \`$BUNDLE\`
          EOF

  build-and-upload-test-ui-image:
    needs:
      - check-changes
      - determine-branch-params
    if: ${{ needs.check-changes.outputs.should-test == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      IMG_NAME: ${{ steps.container.outputs.IMG_NAME }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.determine-branch-params.outputs.build_checkout_ref }}

      - id: container
        name: build the tackle2-ui container
        env:
          IMG_NAME: ttl.sh/tackle2-ui-${{ github.sha }}:2h
        run: |
          echo "IMG_NAME=${IMG_NAME}" >> "$GITHUB_OUTPUT"
          docker build . -t ${IMG_NAME}
          docker push ${IMG_NAME}

          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Test UI Image
            - UI image: \`$IMG_NAME\`
          EOF

  run-e2e-tests:
    needs:
      - check-changes
      - determine-branch-params
      - build-and-upload-test-ui-image
    if: ${{ !cancelled() && !failure() && needs.check-changes.outputs.should-test == 'true' }}
    secrets: inherit

    strategy:
      fail-fast: false
      matrix:
        test_tags:
          - "@tier0"
          - "@ci,@tier2_A"
          - "@tier2_B"
          - "@tier3_A"
          - "@tier3_B"
          - "@tier3_C"
          - "@tier3_D"
          - "@tier3_E"
          - "@tier3_F"
    uses: ./.github/workflows/e2e-run-ui-tests.yaml
    with:
      test_tags: ${{ matrix.test_tags }}
      feature_auth_required: false
      install_konveyor_version: ${{ needs.determine-branch-params.outputs.install_konveyor_version }}
      bundle_image: ${{ needs.determine-branch-params.outputs.bundle_image }}
      ui_image: ${{ needs.build-and-upload-test-ui-image.outputs.IMG_NAME }}
      test_ref: ${{ needs.determine-branch-params.outputs.test_from_checkout_ref }}

  e2e-tests:
    if: ${{ always() }}
    runs-on: ubuntu-latest
    name: e2e-tests
    needs: [check-changes, run-e2e-tests]
    steps:
      - name: Check test results
        run: |
          if [[ "${{ needs.check-changes.outputs.should-test }}" == "false" ]]; then
            echo "Tests skipped (docs-only changes)"
            exit 0
          fi
          if [[ "${{ needs.run-e2e-tests.result }}" == "success" || "${{ needs.run-e2e-tests.result }}" == "skipped" ]]; then
            echo "Tests passed or were skipped"
            exit 0
          fi
          echo "Tests failed: ${{ needs.run-e2e-tests.result }}"
          exit 1
