name: CI (e2e tests)

on:
  push:
    branches:
      - "main"
      - "release-*"

  pull_request:
    paths-ignore:
      - "docs/**"
      - "hack/**"
      - "**/*.md"
      - "**/*.mdc"
      - ".coderabbit.yaml"
    branches:
      - "main"
      - "release-*"

  workflow_call:
    inputs:
      checkout_ref:
        type: string
        description: Git ref to checkout (defaults to the triggering ref)
        required: false

permissions:
  contents: read

concurrency:
  group: ci-e2e-tests-${{ inputs.checkout_ref || github.ref }}
  cancel-in-progress: true

jobs:
  determine-branch-params:
    runs-on: ubuntu-latest
    outputs:
      target_branch: ${{ steps.params.outputs.target_branch }}
      bundle_image: ${{ steps.params.outputs.bundle_image }}
      install_konveyor_version: ${{ steps.params.outputs.install_konveyor_version }}
      build_checkout_ref: ${{ steps.params.outputs.build_checkout_ref }}
      test_from_checkout_ref: ${{ steps.params.outputs.test_from_checkout_ref }}
      agentic_konveyor_version: ${{ steps.params.outputs.agentic_konveyor_version }}
      e2e_test_tags: ${{ steps.params.outputs.e2e_test_tags }}
    steps:
      - name: Determine branch-specific parameters
        id: params
        env:
          CHECKOUT_REF: ${{ inputs.checkout_ref }}
          BASE_REF: ${{ github.base_ref }}
          REF_NAME: ${{ github.ref_name }}
          GITHUB_REF: ${{ github.ref }}
        run: |
          # Resolve the target branch (deployment context)
          # Priority: explicit workflow_call input > PR base branch > push branch
          TARGET="${CHECKOUT_REF:-${BASE_REF:-${REF_NAME}}}"
          TARGET="${TARGET#refs/heads/}"

          # Resolve the checkout ref (code to build)
          # workflow_call with explicit ref: use that ref
          # pull_request / push: use github.ref (PR merge ref or branch ref)
          CHECKOUT="${CHECKOUT_REF:-${GITHUB_REF}}"

          # Resolve the test from checkout ref (code to test)
          # TODO: This implies build and test from the same ref. If we need to build and test
          #       from different refs, this var will need to be updated.
          TEST_FROM_CHECKOUT_REF="${CHECKOUT}"

          # Map target branch to operator version and bundle image tag
          # For release branches, use the corresponding release tag instead of the branch
          if [[ "$TARGET" == "main" ]]; then
            IMAGE_TAG="latest"
            OPERATOR_VERSION="main"
          elif [[ "$TARGET" == "release-0.10" ]]; then
            IMAGE_TAG="v0.10.0-beta.1"
            OPERATOR_VERSION="v0.10.0-beta.1"
          elif [[ "$TARGET" == "release-0.11" ]]; then
            # Bumping this? The agentic leg is pinned to an operator commit
            # further down for as long as this says v0.11.0-beta.1. Bump to a
            # tag that has konveyor/operator#627 and delete that pin with it.
            IMAGE_TAG="v0.11.0-beta.1"
            OPERATOR_VERSION="v0.11.0-beta.1"
          else
            # For other release branches, use the branch name
            IMAGE_TAG="$TARGET"
            OPERATOR_VERSION="$TARGET"
          fi

          BUNDLE="quay.io/konveyor/tackle2-operator-bundle:${IMAGE_TAG}"

          echo "target_branch=$TARGET" >> "$GITHUB_OUTPUT"
          echo "bundle_image=$BUNDLE" >> "$GITHUB_OUTPUT"
          echo "install_konveyor_version=$OPERATOR_VERSION" >> "$GITHUB_OUTPUT"
          echo "build_checkout_ref=$CHECKOUT" >> "$GITHUB_OUTPUT"
          # The agentic leg needs actions from konveyor/operator, checked out
          # at $TARGET. They are on main and from release-0.11 on, so older
          # release branches would run a leg that can never resolve them.
          TAGS='"@tier0","@ci,@tier2_A","@tier2_B","@tier3_A","@tier3_B","@tier3_C","@tier3_D","@tier3_E","@tier3_F"'
          AGENTIC=false
          if [[ "$TARGET" == "main" ]]; then
            AGENTIC=true
          elif [[ "$TARGET" == release-* ]]; then
            OLDEST=$(printf '%s\n%s\n' "${TARGET#release-}" "0.11" | sort -V | head -1)
            if [[ "$OLDEST" == "0.11" ]]; then
              AGENTIC=true
            fi
          fi
          if [[ "$AGENTIC" == "true" ]]; then
            TAGS="\"@agentic\",$TAGS"
          fi
          echo "e2e_test_tags=[$TAGS]" >> "$GITHUB_OUTPUT"
          # The agentic leg's actions (konveyor/operator#627) are on the
          # operator's release-0.11 branch but in no v0.11 tag yet, so that
          # leg alone takes them from the commit that added them. Keyed on the
          # tag above rather than the branch, so the pin stops applying the
          # moment that tag is bumped instead of outliving it. Delete it then.
          AGENTIC_OPERATOR_VERSION="$OPERATOR_VERSION"
          if [[ "$OPERATOR_VERSION" == "v0.11.0-beta.1" ]]; then
            AGENTIC_OPERATOR_VERSION="58ccd10fc5b6f4180c7d600a716b5b198180301a"
          fi
          echo "agentic_konveyor_version=$AGENTIC_OPERATOR_VERSION" >> "$GITHUB_OUTPUT"
          echo "test_from_checkout_ref=$TEST_FROM_CHECKOUT_REF" >> "$GITHUB_OUTPUT"

          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Branch Parameters
            - target_branch: \`$TARGET\`
            - build_checkout_ref: \`$CHECKOUT\`
            - test_from_checkout_ref: \`$TEST_FROM_CHECKOUT_REF\`
            - install_konveyor_version: \`$OPERATOR_VERSION\`
            - bundle_image: \`$BUNDLE\`
          EOF

  build-and-upload-test-ui-image:
    needs: determine-branch-params
    runs-on: ubuntu-latest
    outputs:
      IMG_NAME: ${{ steps.container.outputs.IMG_NAME }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.determine-branch-params.outputs.build_checkout_ref }}

      - id: container
        name: build the tackle2-ui container
        env:
          IMG_NAME: ttl.sh/tackle2-ui-${{ github.sha }}:2h
        run: |
          echo "IMG_NAME=${IMG_NAME}" >> "$GITHUB_OUTPUT"
          docker build . -t ${IMG_NAME}
          docker push ${IMG_NAME}

          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Test UI Image
            - UI image: \`$IMG_NAME\`
          EOF

  run-e2e-tests:
    needs:
      - determine-branch-params
      - build-and-upload-test-ui-image
    secrets: inherit

    strategy:
      fail-fast: false
      matrix:
        # From determine-branch-params, which adds the @agentic leg on main
        # only. It runs on every PR there, so a broken agentic flow fails the
        # PR, as its own leg rather than a tag bolted onto an existing tier -
        # the extra setup stays confined and a failure points at the agentic
        # console rather than at whichever tier was carrying it.
        test_tags: ${{ fromJSON(needs.determine-branch-params.outputs.e2e_test_tags) }}
    uses: ./.github/workflows/e2e-run-ui-tests.yaml
    with:
      test_tags: ${{ matrix.test_tags }}
      agentic: ${{ matrix.test_tags == '@agentic' }}
      feature_auth_required: false
      install_konveyor_version: >-
        ${{ matrix.test_tags == '@agentic'
        && needs.determine-branch-params.outputs.agentic_konveyor_version
        || needs.determine-branch-params.outputs.install_konveyor_version }}
      bundle_image: ${{ needs.determine-branch-params.outputs.bundle_image }}
      ui_image: ${{ needs.build-and-upload-test-ui-image.outputs.IMG_NAME }}
      test_ref: ${{ needs.determine-branch-params.outputs.test_from_checkout_ref }}
