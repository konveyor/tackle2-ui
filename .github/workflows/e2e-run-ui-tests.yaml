name: e2e - run UI tests on minikube

on:
  workflow_call: # call from another workflow
    inputs:
      test_tags:
        type: string
        default: "@ci,@tier0"

      feature_auth_required:
        type: boolean
        default: false

      agentic:
        type: boolean
        default: false
        description: |
          Enable the agentic console and set up what a run needs: the Agent
          Sandbox CRD, an LLM emulator, a Gateway pointing at it, and an
          application to run against. Off by default, so every other job
          installs exactly what it did before.

      bundle_image:
        type: string
        default: quay.io/konveyor/tackle2-operator-bundle:latest

      ui_image:
        type: string
        default: quay.io/konveyor/tackle2-ui:latest

      install_konveyor_version:
        type: string
        default: main

      test_ref:
        type: string
        default: main

    secrets:
      GIT_USER:
        required: false
      GIT_PASSWORD:
        required: false
      SVN_USER:
        required: false
      SVN_PASSWORD:
        required: false
      JIRA_STAGE_DATACENTER_URL:
        required: false
      JIRA_STAGE_BEARER_TOKEN:
        required: false
      JIRA_STAGE_BASIC_LOGIN:
        required: false
      JIRA_STAGE_BASIC_PASSWORD:
        required: false
      JIRA_ATLASSIAN_CLOUD_URL:
        required: false
      JIRA_ATLASSIAN_CLOUD_EMAIL:
        required: false
      JIRA_ATLASSIAN_CLOUD_TOKEN:
        required: false

  workflow_dispatch: # start from GitHub UI or API
    inputs:
      agentic:
        description: Enable the agentic console and the fixtures a run needs
        type: boolean
        default: false

      test_tags:
        description: Comma separated list of test tags to run
        type: string
        default: "@ci,@tier0"

      feature_auth_required:
        description: Enable authentication?
        type: boolean
        default: false

      bundle_image:
        description: Operator bundle image to use
        type: string
        default: quay.io/konveyor/tackle2-operator-bundle:latest

      ui_image:
        description: UI image to use when installing Konveyor
        type: string
        default: quay.io/konveyor/tackle2-ui:latest

      install_konveyor_version:
        description: Ref in operator repo to use for the install-konveyor action
        type: string
        default: main

      test_ref:
        description: Ref in this repo to use for the tests
        type: string
        default: main

permissions:
  contents: read

jobs:
  run-test:
    name: "Run tests - ${{ inputs.feature_auth_required && 'auth' || 'noauth' }}, test: ${{ inputs.test_ref }}, tags: ${{ inputs.test_tags }}"
    runs-on: ubuntu-latest

    steps:
      - name: Setup minikube
        uses: konveyor/operator/.github/actions/start-minikube@main
        with:
          memory: "max"
          cpus: "max"

      - name: Checkout the operator so we can pick the install-konveyor version to use dynamically
        uses: actions/checkout@v7
        with:
          repository: konveyor/operator
          ref: ${{ inputs.install_konveyor_version }}
          path: konveyor-operator

      - name: "Install konveyor using ${{ inputs.install_konveyor_version }}"
        uses: ./konveyor-operator/.github/actions/install-konveyor
        with:
          bundle_image: ${{ inputs.bundle_image }}
          install_agent_sandbox: ${{ inputs.agentic }}
          # Folded, because the JSON's colons are not valid unquoted YAML.
          seed_application: >-
            ${{ inputs.agentic
            && '{"name": "agentic-e2e", "repository": {"kind": "git",
            "url": "https://github.com/konveyor/tackle-testapp-public.git",
            "branch": "main"}}'
            || '' }}
          tackle_cr: |
            kind: Tackle
            apiVersion: tackle.konveyor.io/v1alpha1
            metadata:
              name: tackle
            spec:
              image_pull_policy: IfNotPresent
              feature_auth_required: ${{ inputs.feature_auth_required }}
              agentic_enabled: ${{ inputs.agentic }}
              ui_image_fqin: ${{ inputs.ui_image }}

      - name: Increase ingress header buffer size for OIDC
        run: |
          kubectl -n ingress-nginx patch configmap ingress-nginx-controller \
            --type merge \
            -p '{"data":{"large-client-header-buffers":"4 32k","proxy-buffer-size":"16k"}}'
          kubectl -n ingress-nginx rollout restart deployment ingress-nginx-controller
          kubectl -n ingress-nginx rollout status deployment ingress-nginx-controller --timeout=120s

      - name: Wait for Ingress
        run: |
          kubectl wait \
            -n konveyor-tackle \
            ingress/tackle \
            --timeout=600s \
            --for=jsonpath='{.status.loadBalancer.ingress[0]}'

          minikube_ip=$(minikube ip)
          echo "ingress is ready at: ${minikube_ip}"
          echo "UI_URL=https://${minikube_ip}" >>$GITHUB_ENV

      - name: "Checkout the repo (ref: ${{ inputs.test_ref }})"
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.test_ref }}
          path: tackle2-ui

      - name: Expose metrics endpoint
        run: |
          tackle2-ui/hack/setup-metrics-endpoint.sh

      - name: Set up the agentic fixtures
        if: ${{ inputs.agentic }}
        uses: ./konveyor-operator/.github/actions/setup-agentic

      - name: "Run UI tests"
        uses: ./tackle2-ui/.github/actions/run-ui-tests
        with:
          test_tags: ${{ inputs.test_tags }}
          tests_ref: ${{ inputs.test_ref }}
          base_url: ${{ env.UI_URL }}
          metrics_url: ${{ env.METRICS_URL }}
          feature_auth_required: ${{ inputs.feature_auth_required }}
          # Pass credentials as inputs
          git_user: ${{ secrets.GIT_USER }}
          git_password: ${{ secrets.GIT_PASSWORD }}
          svn_user: ${{ secrets.SVN_USER }}
          svn_password: ${{ secrets.SVN_PASSWORD }}
          jira_stage_datacenter_url: ${{ secrets.JIRA_STAGE_DATACENTER_URL }}
          jira_stage_bearer_token: ${{ secrets.JIRA_STAGE_BEARER_TOKEN }}
          jira_stage_basic_login: ${{ secrets.JIRA_STAGE_BASIC_LOGIN }}
          jira_stage_basic_password: ${{ secrets.JIRA_STAGE_BASIC_PASSWORD }}
          jira_atlassian_cloud_url: ${{ secrets.JIRA_ATLASSIAN_CLOUD_URL }}
          jira_atlassian_cloud_email: ${{ secrets.JIRA_ATLASSIAN_CLOUD_EMAIL }}
          jira_atlassian_cloud_token: ${{ secrets.JIRA_ATLASSIAN_CLOUD_TOKEN }}

      - name: Emulator request log
        if: ${{ failure() && inputs.agentic }}
        # The setup action dumps this if setup fails; this covers the run
        # failing afterwards, which is when it matters most. The sandbox pod is
        # gone by the time anyone reads the failure, so the emulator's record
        # of what was asked and which tools were offered is all that survives.
        run: |
          kubectl -n konveyor-tackle logs deployment/llemulator --tail=400 || true
          kubectl -n konveyor-tackle get agentruns.konveyor.io -o wide || true
